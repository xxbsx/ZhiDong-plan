<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181b2e"/>
      <stop offset="1" stop-color="#2b2a50"/>
    </linearGradient>
    <linearGradient id="shirtL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b6fdf"/>
      <stop offset="1" stop-color="#3f50bb"/>
    </linearGradient>
  </defs>

  <!-- 背景（与阿伟同款构图，蓝紫调） -->
  <rect width="512" height="512" rx="112" fill="url(#bgL)"/>
  <circle cx="436" cy="78" r="86" fill="#6b66c9" opacity="0.18"/>
  <circle cx="70" cy="446" r="58" fill="#ffffff" opacity="0.04"/>

  <!-- 后层头发（匹配窄脸 rx84） -->
  <ellipse cx="256" cy="236" rx="110" ry="142" fill="#232029"/>

  <!-- 脖子 -->
  <path d="M224 302 H288 V348 C288 369 271 381 256 381 C241 381 224 369 224 348 Z" fill="#dca983"/>

  <!-- 身体 / 蓝色运动衫（与阿伟同款版型） -->
  <path d="M88 512 V424 C88 356 162 326 256 326 C350 326 424 356 424 424 V512 Z" fill="url(#shirtL)"/>
  <path d="M150 512 C150 442 196 410 256 410 C316 410 362 442 362 512 Z" fill="#32409b" opacity="0.28"/>

  <!-- 前侧长发（沿脸颊垂到胸前以下，内层画在脸之前） -->
  <path d="M180 196
           C160 214 146 262 148 320
           C150 380 156 432 158 474
           C159 484 176 484 180 474
           C190 410 192 330 186 268
           C183 236 192 210 180 196 Z" fill="#232029"/>
  <path d="M332 196
